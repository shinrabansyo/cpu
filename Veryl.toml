[project]
name = "veryl"
version = "0.1.0"

[build]
target = { type = "directory", path = "target" }
reset_type = "sync_high"
expand_inside_operation = true

[test]
waveform_format = "fst"
include_files = [
    "verilator.vlt",
    "test/tmp_inst.hex" ,
    "test/tmp_data.hex",
]

[test.verilator]
compile_args = ["-j", "8", "verilator.vlt"]
